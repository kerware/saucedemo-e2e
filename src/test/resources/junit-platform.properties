# Dernière génération/modification faite par l'IA Claude le 07/10/2026 17:16:32
# Exécution séquentielle : une session Playwright partagée (Playwright n'est pas thread-safe).
junit.jupiter.execution.parallel.enabled=false

# Garde-fou : aucun test ne doit dépasser 2 minutes.
junit.jupiter.execution.timeout.default=2 m

# Ordre d'exécution déterministe des classes et des méthodes.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$DisplayName
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$DisplayName

# Cucumber : les scénarios Gherkin passent uniquement par la suite ScenariosGherkinTest.
# Sans cette clé, le moteur Cucumber pourrait aussi les découvrir seul (exécution en double dans certains IDE).
cucumber.junit-platform.discovery.as-root-engine=false
