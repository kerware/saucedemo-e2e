# Dernière génération/modification faite par l'IA Claude le 07/10/2026 15:52:12
# =====================================================================
#  Valeurs par défaut, communes à tous les environnements.
#  Surchargées par config/<env>.properties, puis par variable
#  d'environnement E2E_<CLE> (ex. E2E_BASE_URL), puis par -D<cle>=...
# =====================================================================

# --- Application
base.url=https://www.saucedemo.com
# Attribut HTML utilisé par getByTestId(...)
testid.attribut=data-test

# --- Navigateur : chromium | firefox | webkit
navigateur=chromium
# Canal optionnel : chrome | msedge (utilise le navigateur installé sur le poste)
navigateur.canal=
# Chemin optionnel vers un exécutable de navigateur
navigateur.executable=
headless=true
# Ralentissement de chaque action (ms), utile en démonstration
slowmo=0
viewport.largeur=1366
viewport.hauteur=768
locale=fr-FR

# --- Délais (ms)
timeout.action.ms=10000
timeout.navigation.ms=30000
# Délai des assertions assertThat(...) : performance_glitch_user met ~5 s à se connecter
timeout.assertion.ms=15000

# --- Traces Playwright : echec (conservées si échec) | toujours | jamais
traces.mode=echec

# --- Données de test (référencées dans les CSV par ${motdepasse.defaut})
# Mot de passe public de l'application de démonstration SauceDemo.
# Pour une vraie application : ne pas versionner, passer par E2E_MOTDEPASSE_DEFAUT.
motdepasse.defaut=secret_sauce

# --- Précondition des tests « utilisateur connecté » (inventaire, panier…)
# Utilisateur de connexion par défaut ; son mot de passe est ${motdepasse.defaut}.
utilisateur.defaut=standard_user
