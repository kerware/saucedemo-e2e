name: Tests E2E

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Installation des navigateurs Playwright
        run: mvn -B -q compile exec:java "-Dexec.args=install --with-deps chromium"

      - name: Exécution des tests
        run: mvn -B verify -Denv=ci

      - name: Publication du rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-e2e
          path: target/rapport-e2e/
          retention-days: 14
